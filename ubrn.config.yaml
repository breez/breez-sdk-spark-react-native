rust:
  repo: https://github.com/breez/spark-sdk
  rev: bc3a1150e7a882f590f986fc6f36c38caa519c5e
  manifestPath: crates/breez-sdk/bindings/Cargo.toml
bindings:
  cpp: cpp/generated
  ts: src/generated
android:
  useSharedLibrary: true
  # Disable server-side storage features (postgres, mysql) to reduce binary size (not needed for mobile)
  cargoExtras:
    - --no-default-features
    - --features
    - secp-lowmemory,release-max-level-debug
ios:
  targets:
    - aarch64-apple-ios
    - aarch64-apple-ios-sim
    - x86_64-apple-ios
  frameworkName: build/RnBreezSdkSpark
  # Disable server-side storage features (postgres, mysql) to reduce binary size (not needed for mobile)
  cargoExtras:
    - --no-default-features
    - --features
    - secp-lowmemory,release-max-level-debug
turboModule:
  cpp: cpp
  ts: src